<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DOGONDOUTCHI FONCIER</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5}.header{background:#0a2a8a;color:white;padding:15px;text-align:center}.header h1{font-size:18px}.search-box{padding:15px;background:white;margin:15px;border-radius:12px}input{width:100%;padding:12px;border:2px solid #0a2a8a;border-radius:8px;font-size:15px}.card{background:white;margin:0 15px 12px;border-radius:12px;padding:15px;border-left:5px solid #22c55e}.card.unpaid{border-left-color:#ef4444}.btn{display:block;background:#0a2a8a;color:white;text-align:center;padding:10px;border-radius:8px;text-decoration:none;margin-top:10px;font-weight:bold}.stat{background:white;padding:12px;border-radius:10px;text-align:center}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 15px 15px}.stat b{font-size:20px;color:#0a2a8a;display:block}</style></head><body>
<div class="header"><p>REPUBLIQUE DU NIGER - DOSSO</p><h1>DOGONDOUTCHI FONCIER</h1><p>Gestion des Parcelles - Mairie de Dogondoutchi</p></div>
<div class="stats"><div class="stat"><b>1,240</b><span>Parcelles</span></div><div class="stat"><b>850</b><span>Payees</span></div><div class="stat"><b>390</b><span>En attente</span></div></div>
<div class="search-box"><input id="search" placeholder="Tape nom, N parcelle, village... Ex: Sambera" onkeyup="filter()"></div>
<div id="list"></div>
<div style="background:#0a2a8a;color:white;text-align:center;padding:15px;font-size:11px">TOPO-DOSSO.COM - Mohamed Amadou Sanda - WhatsApp 97 08 92 85</div>
<script>
const data=[
{id:"P-101",village:"Sambera",prop:"Moussa Harouna",sup:"450 m2",statut:"paye"},
{id:"P-102",village:"Sambera",prop:"Aicha Sanda",sup:"600 m2",statut:"impaye"},
{id:"P-103",village:"Sambera",prop:"Idrissa Boubacar",sup:"500 m2",statut:"paye"},
{id:"P-201",village:"Golle",prop:"Fati Abdoulaye",sup:"400 m2",statut:"impaye"},
{id:"P-202",village:"Golle",prop:"Oumarou Djibo",sup:"550 m2",statut:"paye"},
{id:"P-301",village:"Dan Kassari",prop:"Hassan Mohamed",sup:"700 m2",statut:"paye"},
];
function filter(){let q=document.getElementById('search').value.toLowerCase();let list=document.getElementById('list');list.innerHTML='';let f=data.filter(d=>d.prop.toLowerCase().includes(q)||d.id.toLowerCase().includes(q)||d.village.toLowerCase().includes(q));f.forEach(d=>{list.innerHTML+=`<div class="card ${d.statut=='impaye'?'unpaid':''}"><h3 style="color:#0a2a8a">Parcelle ${d.id} - ${d.village} - ${d.statut=='paye'?'PAYE':'NON PAYE'}</h3><p>Proprietaire: <b>${d.prop}</b></p><p>Superficie: <b>${d.sup}</b></p><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Dogondoutchi ${d.id} ${d.village}">Voir Plan sur Carte</a></div>`});}
filter();
</script></body></html>
